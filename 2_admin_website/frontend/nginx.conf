# =============================================================================
# nginx.conf — Admin Website Frontend
# =============================================================================
# Serves the ADM Admin Website React SPA from the /admin/ base path.
#
# The Vite config sets base: '/admin/', so all generated asset URLs
# are prefixed with /admin/. The build output is placed in
# /usr/share/nginx/html/admin/ by the Dockerfile.
#
# Features:
#   - SPA fallback: all /admin/* routes → /admin/index.html
#   - Gzip compression for text-based assets
#   - Cache headers: 1 year for hashed assets, no-cache for index.html
#   - Security headers (XSS, clickjacking, MIME sniffing protection)
#   - Server tokens off (hides nginx version for security)
#   - client_max_body_size 100m (supports large multipart project intakes)
#   - Proper MIME types (included via mime.types)
#   - Custom error pages
# =============================================================================

server {
    listen 80;
    server_name _;

    # ── Security & Performance Hardening ─────────────────────────────────────
    server_tokens off;
    
    # Increased to 100m to support large project files, multi-document uploads,
    # and team photo / banner updates without HTTP 413 Payload Too Large.
    client_max_body_size 100m;

    # ── Document Root ───────────────────────────────────────────────────────
    root /usr/share/nginx/html;
    index index.html;

    # ── Gzip Compression ───────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml
        font/woff
        font/woff2;

    # ── Security Headers ───────────────────────────────────────────────────
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── Redirect / → /admin/ ──────────────────────────────────────────────
    # When accessed directly, redirect to the admin base path.
    location = / {
        return 301 /admin/;
    }

    # ── SPA Routing for /admin/ ────────────────────────────────────────────
    # For any URL under /admin/ that doesn't match a physical file,
    # serve /admin/index.html. React Router handles client-side routing.
    location /admin/ {
        try_files $uri $uri/ /admin/index.html;
    }

    # ── Static Asset Caching (under /admin/) ───────────────────────────────
    # Vite generates hashed filenames (e.g., main.abc123.js), so they can
    # be cached aggressively — the hash changes whenever content changes.
    location ~* ^/admin/.*\.(?:js|css|woff2?|ttf|eot|otf|ico|svg|gif|jpe?g|png|webp|avif)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # ── HTML — No Cache ────────────────────────────────────────────────────
    # index.html must NOT be cached so users always get the latest version.
    location = /admin/index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # ── Error Pages ────────────────────────────────────────────────────────
    error_page 404 /admin/index.html;
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }

    # ── Logging ────────────────────────────────────────────────────────────
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;
}
