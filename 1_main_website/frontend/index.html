        const ChatBot = () => {
            const [isOpen, setIsOpen] = React.useState(false);
            const [messages, setMessages] = React.useState([]);
            const [inputValue, setInputValue] = React.useState("");
            const [conversationState, setConversationState] = React.useState({
                mode: null, // 'dashboard', 'documentation', or null
                step: 0,
                data: {}
            });

            const projectOptions = [
                { category: "Finance", items: ["EH Dashboard", "PFO Dashboard"] },
                { category: "Supply Chain", items: ["Inventory Optimizer", "Route Tracking"] },
                { category: "Marketing", items: ["Customer LTV", "Attribution"] },
                { category: "Sales", items: ["EETC", "Booking Prediction"] }
            ];

            const toggleChat = () => {
                if (!isOpen) {
                    setIsOpen(true);
                    if (messages.length === 0) {
                        setTimeout(() => {
                            setMessages([{
                                text: "👋 Hi! I'm your ADM Assistant. I can help you with:\n\n1️⃣ Request Dashboard Access\n2️⃣ General Questions\n\nWhat would you like to do?",
                                sender: "bot"
                            }]);
                        }, 500);
                    }
                } else {
                    setIsOpen(false);
                }
            };

            const handleBotResponse = (userInput) => {
                const input = userInput.toLowerCase().trim();
                let botResponse = "";
                let newState = { ...conversationState };

                // Initial mode selection
                if (!conversationState.mode) {
                    if (input.includes('dashboard') || input.includes('1')) {
                        newState.mode = 'dashboard';
                        newState.step = 1;
                        botResponse = "Great! Let's request dashboard access. 📊\n\nFirst, please provide your TE User ID (e.g., TE123456):";
                    } else if (input.includes('documentation') || input.includes('document') || input.includes('2')) {
                        newState.mode = 'documentation';
                        newState.step = 1;
                        botResponse = "Perfect! Let's request documentation access. 📄\n\nFirst, please provide your TE User ID (e.g., TE123456):";
                    } else if (input.includes('question') || input.includes('help') || input.includes('3')) {
                        botResponse = "I'm here to help! You can ask me about:\n\n• How to access dashboards\n• Available projects\n• Data sources\n• Platform features\n\nWhat would you like to know?";
                    } else {
                        botResponse = "I can help you with:\n\n1️⃣ Request Dashboard Access\n2️⃣ Request Documentation\n3️⃣ General Questions\n\nPlease choose an option (1, 2, or 3).";
                    }
                }
                // Dashboard/Documentation request flow
                else if (conversationState.mode === 'dashboard' || conversationState.mode === 'documentation') {
                    switch (conversationState.step) {
                        case 1: // TE ID received
                            newState.data.teId = userInput;
                            newState.step = 2;
                            botResponse = "Thanks! Now, please provide your location/site (e.g., Schaffhausen, CH):";
                            break;

                        case 2: // Location received
                            newState.data.location = userInput;
                            newState.step = 3;
                            botResponse = "Got it! Please provide your corporate email (e.g., first.last@te.com):";
                            break;

                        case 3: // Email received
                            newState.data.email = userInput;
                            newState.step = 4;
                            const resourceType = conversationState.mode === 'dashboard' ? 'dashboard' : 'documentation';
                            let optionsList = "";
                            projectOptions.forEach((cat, idx) => {
                                optionsList += `\n\n${cat.category}:\n`;
                                cat.items.forEach((item, itemIdx) => {
                                    const num = idx * 10 + itemIdx + 1;
                                    optionsList += `  ${num}. ${item}`;
                                    if (itemIdx < cat.items.length - 1) optionsList += "\n";
                                });
                            });
                            botResponse = `Perfect! Now, which ${resourceType} do you need access to?${optionsList}\n\nPlease enter the number or name:`;
                            break;

                        case 4: // Project selected
                            newState.data.project = userInput;
                            newState.step = 5;
                            botResponse = "Almost done! Please provide a brief reason for this request:";
                            break;

                        case 5: // Reason received
                            newState.data.reason = userInput;
                            const resourceName = conversationState.mode === 'dashboard' ? 'Dashboard' : 'Documentation';
                            botResponse = `✅ Request Submitted Successfully!\n\n📋 Summary:\n• TE ID: ${newState.data.teId}\n• Location: ${newState.data.location}\n• Email: ${newState.data.email}\n• ${resourceName}: ${newState.data.project}\n• Reason: ${newState.data.reason}\n\nYour request has been sent to the admin team. You'll receive a confirmation email shortly!\n\nNeed anything else?`;
                            // Reset state
                            newState = { mode: null, step: 0, data: {} };
                            break;
                    }
                }
                // General questions
                else {
                    if (input.includes('dashboard') && input.includes('access')) {
                        botResponse = "To access dashboards, you need to:\n\n1. Submit an access request\n2. Get approval from your manager\n3. Receive credentials via email\n\nWould you like me to help you submit a request now?";
                    } else if (input.includes('project')) {
                        botResponse = "We have projects across 4 functions:\n\n📊 Finance: EH Dashboard, PFO Dashboard\n📦 Supply Chain: Inventory Optimizer, Route Tracking\n📈 Marketing: Customer LTV, Attribution\n💼 Sales: EETC, Booking Prediction\n\nWant to request access to any of these?";
                    } else if (input.includes('data source')) {
                        botResponse = "Our platform integrates data from:\n\n• SAP (Finance & Supply Chain)\n• EDGE (Sales data)\n• TED (Financial reporting)\n• SAP IBP (Inventory planning)\n• Salesforce (Customer data)\n• Google Ads (Marketing attribution)\n\nAll data is updated in real-time!";
                    } else {
                        botResponse = "I'm not sure about that. Try asking about:\n\n• Dashboard access\n• Available projects\n• Data sources\n\nOr type 'menu' to see all options.";
                    }
                }

                setConversationState(newState);
                return botResponse;
            };

            const handleSend = () => {
                if (!inputValue.trim()) return;

                const userMessage = { text: inputValue, sender: 'user' };
                setMessages(prev => [...prev, userMessage]);
                setInputValue("");

                setTimeout(() => {
                    const botResponse = handleBotResponse(inputValue);
                    setMessages(prev => [...prev, { text: botResponse, sender: 'bot' }]);
                }, 800);
            };

            return (
                <div className="fixed bottom-8 right-8 z-[100] flex flex-col items-end gap-6">
                    {isOpen && (
                        <div className="w-[22rem] h-[32rem] bg-white/80 backdrop-blur-2xl rounded-[2rem] shadow-[0_20px_50px_-12px_rgba(0,0,0,0.2)] border border-white/40 flex flex-col overflow-hidden animate-slideUp origin-bottom-right">

                            <div className="bg-gradient-to-r from-adm to-adm-light p-6 rounded-t-[2rem] shadow-lg relative overflow-hidden">
                                <div className="absolute top-0 right-0 w-32 h-32 bg-orange-500/10 rounded-full blur-2xl -mr-10 -mt-10"></div>
                                <div className="flex justify-between items-center relative z-10">
                                    <div>
                                        <h3 className="font-black text-white uppercase tracking-widest text-sm flex items-center gap-2">
                                            <div className="w-2 h-2 bg-green-400 rounded-full animate-pulse shadow-[0_0_10px_rgba(74,222,128,0.5)]"></div>
                                            ADM Assistant
                                        </h3>
                                        <p className="text-white/60 text-[10px] uppercase tracking-wider mt-1 font-medium">AI-Powered</p>
                                    </div>
                                    <button
                                        onClick={() => setIsOpen(false)}
                                        className="w-8 h-8 rounded-full bg-white/10 hover:bg-white/20 flex items-center justify-center transition-all"
                                    >
                                        <Icon path={icons.x} className="w-4 h-4 text-white" />
                                    </button>
                                </div>
                            </div>

                            {/* Messages */}
                            <div className="flex-1 p-5 overflow-y-auto space-y-4 bg-gray-50/50 scrollbar-hide">
                                {messages.map((msg, idx) => (
                                    <div key={idx} className={`flex ${msg.sender === 'bot' ? 'justify-start' : 'justify-end'}`}>
                                        <div className={`max-w-[85%] p-4 rounded-2xl text-xs font-bold leading-relaxed shadow-sm animate-fadeIn whitespace-pre-line ${msg.sender === 'bot'
                                            ? 'bg-white text-gray-700 rounded-tl-none border border-gray-100'
                                            : 'bg-gradient-to-br from-orange-400 to-orange-600 text-white rounded-tr-none shadow-orange-200'
                                            }`}>
                                            {msg.text}
                                        </div>
                                    </div>
                                ))}
                            </div>

                            {/* Input */}
                            <div className="p-4 bg-white/50 backdrop-blur-sm border-t border-white/20">
                                <div className="flex gap-2 bg-white p-1.5 pl-5 rounded-full border border-gray-100 shadow-sm focus-within:border-orange-500/50 focus-within:shadow-orange-100 transition-all">
                                    <input
                                        type="text"
                                        value={inputValue}
                                        onChange={(e) => setInputValue(e.target.value)}
                                        onKeyPress={(e) => e.key === 'Enter' && handleSend()}
                                        placeholder="Type your message..."
                                        className="flex-1 text-xs font-semibold text-gray-700 outline-none bg-transparent placeholder:text-gray-400"
                                    />
                                    <button
                                        onClick={handleSend}
                                        className="w-9 h-9 bg-adm text-white rounded-full flex items-center justify-center hover:bg-orange-500 transition-colors shadow-md"
                                    >
                                        <Icon path={icons.chevronRight} className="w-4 h-4" />
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    <button
                        onClick={toggleChat}
                        className={`group relative w-16 h-16 rounded-full shadow-[0_10px_40px_-10px_rgba(249,115,22,0.6)] flex items-center justify-center text-white transition-all duration-300 hover:scale-110 z-[100] ${isOpen ? 'bg-adm rotate-90' : 'bg-gradient-to-br from-orange-400 to-orange-600'
                            }`}
                    >
                        {/* Pulse Ring */}
                        {!isOpen && <div className="absolute inset-0 rounded-full bg-orange-500 animate-[ping_2s_ease-in-out_infinite] opacity-20"></div>}
                        <Icon path={isOpen ? icons.x : icons.message} className="w-7 h-7" />
                    </button>
                </div>
            );
        };

        const HeroSection = () => {
            const [selectedNews, setSelectedNews] = React.useState(null);
            const listRef = React.useRef(null);
            const [isPaused, setIsPaused] = React.useState(false);
            const [showModal, setShowModal] = React.useState(false);

            const openNewsModal = (news) => {
                setSelectedNews(news);
                setShowModal(true);
            };

            const closeNewsModal = () => {
                setShowModal(false);
                setSelectedNews(null);
            };

            // Ping-Pong Auto-scroll effect
            React.useEffect(() => {
                const list = listRef.current;
                if (!list || isPaused) return;

                const scrollSpeed = 1; // Pixels per interval
                let scrollDirection = 1; // 1 = down, -1 = up
                let scrollInterval;

                const startScrolling = () => {
                    scrollInterval = setInterval(() => {
                        // Check if bottom reached
                        if (scrollDirection === 1 && list.scrollTop + list.clientHeight >= list.scrollHeight - 1) {
                            scrollDirection = -1; // Switch to Up
                        }
                        // Check if top reached
                        else if (scrollDirection === -1 && list.scrollTop <= 0) {
                            scrollDirection = 1; // Switch to Down
                        }

                        list.scrollTop += (scrollSpeed * scrollDirection);
                    }, 50);
                };

                startScrolling();
                return () => clearInterval(scrollInterval);
            }, [isPaused]);


            const getCategoryColor = (category) => {
                return category.includes('AI') ? 'text-blue-500 bg-blue-50' : 'text-orange-500 bg-orange-50';
            };

            const getCategoryBorder = (category) => {
                return category.includes('AI') ? 'group-hover:border-blue-500' : 'group-hover:border-orange-500';
            };

            return (
                <div className="w-full h-full flex flex-col pt-[16px] pb-[16px]">
                    {/* Content Container */}
                    <div className="flex flex-col h-full w-full max-w-[1600px] mx-auto px-4 md:px-8 overflow-hidden min-h-0">
                        {/* Header */}
                        <div className="mb-3 flex flex-col justify-end pt-[12px]">
                            <h1 className="text-[24px] font-bold text-gray-900 tracking-tight mb-1" style={{ fontFamily: '"Inter", sans-serif' }}>
                                Analytics Dashboard
                            </h1>
                            <div className="w-12 h-1 bg-orange-500 rounded-full"></div>
                        </div>

                        {/* Cards Grid */}

                            <div className="flex items-center gap-4 mr-auto">
                                <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('home'); }} className="flex items-center gap-3 group">
                                    <div className={`transition-all duration-500 flex items-center justify-center bg-white rounded-xl shadow-md group-hover:shadow-orange-500/20 group-hover:scale-105 ${isScrolled ? 'w-10 h-10' : 'w-12 h-12'}`}>
                                        <img src="https://adm.te.com/adm_logo.png" alt="AD&M AACE Logo" className={`object-contain ${isScrolled ? 'w-6 h-6' : 'w-7 h-7'}`} />
                                    </div>
                                    <div className="flex flex-col">
                                        <div className={`font-black uppercase tracking-widest text-white transition-all duration-500 ${isScrolled ? 'text-lg' : 'text-xl'}`} style={{ fontFamily: '"Inter", sans-serif' }}>
                                            AD&M AACE <span className="text-orange-500 font-light">ANALYTICS</span>
                                        </div>
                                    </div>
                                </a>
                            </div>

                            {currentView === 'home' && (
                                /* Right Navigation (Static) */
                                <div className={`flex items-center transition-all duration-500 ${isScrolled ? 'gap-2 bg-white/5 p-1.5 rounded-2xl border border-white/5 backdrop-blur-md' : 'gap-6'}`}>
                                    {/* Navigation Links */}
                                    <div className="relative group/nav">
                                        <button
                                            onClick={() => setIsCapabilitiesOpen(!isCapabilitiesOpen)}
                                            className={`font-semibold uppercase tracking-wider transition-all duration-300 flex items-center gap-2 ${activeNav === 'CAPABILITIES' ? 'text-white' : 'text-gray-400'} hover:text-orange-500 ${isScrolled ? 'px-3 py-2 text-[11px]' : 'px-4 py-2 text-[13px]'} relative overflow-hidden`}
                                            style={{ fontFamily: '"Inter", sans-serif' }}
                                        >
                                            <span className="relative z-10 flex items-center gap-1.5">Capabilities <Icon path={icons.chevronRight} className={`w-3.5 h-3.5 transition-transform duration-300 rotate-90 ${isCapabilitiesOpen || activeNav === 'CAPABILITIES' ? 'text-orange-500' : ''}`} /></span>
                                            {/* Hover underline effect */}
                                            <div className="absolute bottom-0 left-0 w-full h-[2px] bg-orange-500 -translate-x-full group-hover/nav:translate-x-0 transition-transform duration-300 ease-out"></div>
                                        </button>
                                        {isCapabilitiesOpen && (
                                            <div className="absolute top-full left-1/2 -translate-x-1/2 mt-4 w-64 bg-gray-900 rounded-[16px] shadow-2xl py-2 border border-gray-800 overflow-hidden z-[60] animate-fadeIn">
                                                <a href="#" className="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 border-b border-gray-800 group transition-colors">
                                                    <span className="font-semibold text-[13px] tracking-wide text-gray-300 group-hover:text-white transition-colors">Analytics</span>
                                                </a>
                                                <a href="#" className="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 border-b border-gray-800 group transition-colors">
                                                    <span className="font-semibold text-[13px] tracking-wide text-gray-300 group-hover:text-white transition-colors">AI/ML</span>
                                                </a>
                                                <a href="#" className="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 group transition-colors">
                                                    <span className="font-semibold text-[13px] tracking-wide text-gray-300 group-hover:text-white transition-colors">Image Analytics</span>
                                                </a>
                                            </div>
                                        )}
                                    </div>

                                    <a
                                        href="#"
                                        onClick={(e) => {
                                            e.preventDefault();
                                            setShowTeamModal(true);
                                            setActiveNav('TEAM');
                                        }}
                                        className={`font-semibold uppercase tracking-wider transition-all duration-300 relative group/nav ${activeNav === 'TEAM' ? 'text-white' : 'text-gray-400'} hover:text-orange-500 ${isScrolled ? 'px-3 py-2 text-[11px]' : 'px-4 py-2 text-[13px]'}`}
                                        style={{ fontFamily: '"Inter", sans-serif' }}
                                    >
                                        <span className="relative z-10">Team</span>
                                        <div className="absolute bottom-0 left-0 w-full h-[2px] bg-orange-500 -translate-x-full group-hover/nav:translate-x-0 transition-transform duration-300 ease-out"></div>
                                    </a>

                                    <a
                                        href="#"
                                        onClick={(e) => {
                                            e.preventDefault();
                                            setCurrentView('home');
                                            setActiveNav('VALUE/ROI');
                                            window.scrollTo({ top: 0, behavior: 'auto' });
                                        }}
                                        className={`font-semibold uppercase tracking-wider transition-all duration-300 relative group/nav ${activeNav === 'VALUE/ROI' ? 'text-white' : 'text-gray-400'} hover:text-orange-500 ${isScrolled ? 'px-3 py-2 text-[11px]' : 'px-4 py-2 text-[13px]'}`}
                                        style={{ fontFamily: '"Inter", sans-serif' }}
                                    >
                                        <span className="relative z-10">Value / ROI</span>
                                        <div className="absolute bottom-0 left-0 w-full h-[2px] bg-orange-500 -translate-x-full group-hover/nav:translate-x-0 transition-transform duration-300 ease-out"></div>
                                    </a>

                                    {/* Connect Dropdown */}
                                    <div className="relative group/nav" ref={connectRef}>
                                        <button
                                            onClick={() => setIsConnectOpen(!isConnectOpen)}
                                            className={`font-semibold uppercase tracking-wider transition-all duration-300 flex items-center gap-2 ${activeNav === 'CONNECT' ? 'text-white' : 'text-gray-400'} hover:text-orange-500 ${isScrolled ? 'px-3 py-2 text-[11px]' : 'px-4 py-2 text-[13px]'} relative overflow-hidden`}
                                            style={{ fontFamily: '"Inter", sans-serif' }}
                                        >
                                            <span className="relative z-10 flex items-center gap-1.5">Connect <Icon path={icons.chevronRight} className={`w-3.5 h-3.5 transition-transform duration-300 rotate-90 ${isConnectOpen || activeNav === 'CONNECT' ? 'text-orange-500' : ''}`} /></span>
                                            <div className="absolute bottom-0 left-0 w-full h-[2px] bg-orange-500 -translate-x-full group-hover/nav:translate-x-0 transition-transform duration-300 ease-out"></div>
                                        </button>
                                        {isConnectOpen && (
                                            <div className="absolute top-full right-0 mt-4 w-64 bg-gray-900 rounded-[16px] shadow-2xl py-2 border border-gray-800 overflow-hidden z-[60] animate-fadeIn">
                                                <a href="#" onClick={(e) => { e.preventDefault(); setShowSubmitRequestModal(true); setIsConnectOpen(false); }} className="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 border-b border-gray-800 group transition-colors"><Icon path={icons.ticket} className="w-5 h-5 text-gray-400 group-hover:text-orange-500 group-hover:scale-110 transition-all" /><span className="font-semibold text-[13px] tracking-wide text-gray-300 group-hover:text-white">Submit Request</span></a>
                                                <a href="mailto:admanalytics@te.com" className="flex items-center gap-4 px-6 py-4 hover:bg-gray-800 group transition-colors"><Icon path={icons.mail} className="w-5 h-5 text-gray-400 group-hover:text-orange-500 group-hover:scale-110 transition-all" /><span className="font-semibold text-[13px] tracking-wide text-gray-300 group-hover:text-white">Email Us</span></a>
                                            </div>
                                        )}
                                    </div>
                                </div>
                            )}

                            {/* Right Section - User Profile Only (No Search/System) */}
                            <div className="flex items-center gap-4 shrink-0">
                                <div className="text-right hidden xl:block animate-fadeIn">
                                    <div className="text-orange-400 text-[10px] font-black uppercase tracking-[0.2em] mb-0.5">Welcome</div>
                                    <div className="text-white text-lg font-black leading-none uppercase tracking-widest">{currentUser?.name?.split(' ')[0] || 'User'}</div>
                                </div>
                                <div
                                    className="w-10 h-10 bg-gradient-to-br from-orange-400 to-orange-600 rounded-xl flex items-center justify-center text-white shadow-lg border-2 border-white/20 group cursor-pointer hover:scale-105 transition-transform relative"
                                    onClick={() => setShowUserDropdown(!showUserDropdown)}
                                >
                                    <Icon path={icons.user} className="w-5 h-5" />
                                </div>
                                {/* User Dropdown Menu */}
                                {showUserDropdown && (
                                    <div className="absolute top-20 right-8 w-64 bg-gray-800 rounded-2xl shadow-2xl py-2 border border-gray-700 overflow-hidden z-[60] animate-fadeIn">
                                        <div className="px-6 py-4 border-b border-gray-700">
                                            <div className="font-bold text-white text-sm">{currentUser?.name || 'User Name'}</div>
                                            <div className="text-xs text-gray-400 mt-1">{currentUser?.email || 'user@email.com'}</div>
                                        </div>
                                        <a href="#" onClick={(e) => {
                                            e.preventDefault();
                                            handleLogout();
                                        }} className="flex items-center gap-4 px-6 py-4 hover:bg-gray-700 group">
                                            <Icon path={icons.x} className="w-5 h-5 text-orange-500 group-hover:scale-110 transition-transform" />
                                            <span className="font-bold text-xs uppercase tracking-widest text-gray-200">Logout</span>
                                        </a>
                                    </div>
                                )}
                            </div>
                        </nav>
                    )}

                    {/* View Rendering */}
                    {currentView === 'login' ? (
                        <Login setCurrentView={setCurrentView} setCurrentUser={setCurrentUser} />
                    ) : currentView === 'register' ? (
                        <Register setCurrentView={setCurrentView} />
                    ) : currentView === 'home' ? (
                        <>
                            {/* Main Layout Container (100vh layout) */}
                            <div className="h-screen w-full flex flex-col pt-[64px] overflow-hidden bg-gray-50 pb-[16px]">
                                {/* Top Half Data */}
                                <div className="flex-1 min-h-0 overflow-hidden">
                                    <HeroSection />
                                </div>

                                {/* Section Spacing */}
                                <div className="h-[20px] shrink-0"></div>

                                {/* Bottom Half Categories */}
                                <div className="shrink-0 overflow-hidden">
                                    <BUSector setCurrentView={setCurrentView} />
                                </div>
                            </div>
                        </>
                    ) : currentView === 'iam' ? (
                        <IAMRequestPage setCurrentView={setCurrentView} />
                    ) : currentView === 'guidelines' ? (
                        <GuidelinesPage setCurrentView={setCurrentView} />
                    ) : null}

                    {
                        !['login', 'register', 'home'].includes(currentView) && (
                            <>
                                <footer className="relative bg-adm text-white py-24 overflow-hidden border-t-[12px] border-orange-500">
                                    {/* Background Depth Gradient */}
                                    <div className="absolute inset-0 bg-[radial-gradient(ellipse_at_top,rgba(255,255,255,0.03),transparent_70%)] pointer-events-none"></div>

                                    <div className="max-w-7xl mx-auto px-6 relative z-10 flex flex-col md:flex-row justify-between items-center gap-10">
                                        <div className="text-center md:text-left">
                                            <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('home'); }} className="group inline-block">
                                                <span className="font-black text-3xl uppercase italic tracking-tighter group-hover:text-orange-500 transition-colors">ADM <span className="text-orange-500 font-light tracking-[0.2em] group-hover:text-white transition-colors">ANALYTICS</span></span>
                                            </a>
                                            <p className="text-gray-500 text-[10px] mt-4 font-bold tracking-[0.3em] uppercase">© 2026 Strategy & Innovation Portal</p>
                                        </div>
                                        <div className="flex flex-wrap justify-center gap-12">

                                            <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('guidelines'); }} className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 hover:text-orange-500 hover:-translate-y-1 transition-all duration-300">Guidelines</a>
                                            <a href="#" onClick={(e) => { e.preventDefault(); setCurrentView('iam'); }} className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 hover:text-orange-500 hover:-translate-y-1 transition-all duration-300">IAM Access</a>
                                            <a href="#" className="text-[11px] font-black uppercase tracking-[0.2em] text-gray-400 hover:text-orange-500 hover:-translate-y-1 transition-all duration-300">Global Support</a>
                                        </div>
                                    </div>
                                </footer>
                                <ChatBot />
                                <TeamOrgChart isOpen={showTeamModal} onClose={() => setShowTeamModal(false)} />
                                <SubmitRequestModal isOpen={showSubmitRequestModal} onClose={() => setShowSubmitRequestModal(false)} />
                            </>
                        )
                    }
                </div >
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
