# =============================================================================
# app-proxy.conf
# Production Nginx Reverse Proxy — 3-Module Application Stack
# External Port: 5174 → Internal Services on localhost
#
# Deploy to: /etc/nginx/conf.d/app-proxy.conf
# Remove:    /etc/nginx/conf.d/default.conf
# Validate:  sudo nginx -t
# Reload:    sudo nginx -s reload
#
# Port Map (internal services — NOT exposed externally):
#   Main Website  FE → 8081   BE → 3000
#   Admin Website FE → 3002   BE → 3001
#   Intake Portal FE → 5175   BE → 8000
# =============================================================================

# -----------------------------------------------------------------------------
# Upstream Definitions
# Centralizes backend addresses for maintainability and future load balancing.
# To scale horizontally, add more `server` entries per upstream block.
# -----------------------------------------------------------------------------
upstream module1_frontend {
    server 127.0.0.1:8081;
    keepalive 16;
}

upstream module1_backend {
    server 127.0.0.1:3000;
    keepalive 16;
}

upstream module2_frontend {
    server 127.0.0.1:3002;
    keepalive 16;
}

upstream module2_backend {
    server 127.0.0.1:3001;
    keepalive 16;
}

upstream module3_frontend {
    server 127.0.0.1:5175;
    keepalive 16;
}

upstream module3_backend {
    server 127.0.0.1:8000;
    keepalive 16;
}

# -----------------------------------------------------------------------------
# Server Block — Single External Entry Point
# -----------------------------------------------------------------------------
server {
    listen 5174;
    server_name _;    # Accept all hostnames; replace with domain when available

    # ─── Global Settings ─────────────────────────────────────────────────
    client_max_body_size 50M;
    proxy_connect_timeout 60s;
    proxy_send_timeout    60s;
    proxy_read_timeout    60s;

    # ─── Common Proxy Headers ────────────────────────────────────────────
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Authorization     $http_authorization;
    proxy_pass_header                  Authorization;
    proxy_set_header Connection        "";
    proxy_http_version 1.1;

    # ─── Security Headers ───────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff" always;
    add_header X-Frame-Options         "SAMEORIGIN" always;
    add_header X-XSS-Protection        "1; mode=block" always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;

    # =====================================================================
    # MODULE 3 — Intake Portal
    # =====================================================================

    # Module 3 Backend API
    # /intake/api/projects/submit → backend receives /api/projects/submit
    location /intake/api/ {
        rewrite ^/intake(/.*)$ $1 break;
        proxy_pass http://module3_backend;
    }

    # Module 3 Frontend
    # /intake/dashboard → frontend receives /dashboard
    location /intake/ {
        proxy_pass http://module3_frontend;
        proxy_intercept_errors off;

        # WebSocket support (Vite HMR in dev; harmless in production)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =====================================================================
    # MODULE 2 — Admin Panel
    # =====================================================================

    # Module 2 Backend — Serve uploaded files (images, documents)
    # /admin/uploads/images/file.jpg → backend receives /uploads/images/file.jpg
    location /admin/uploads/ {
        rewrite ^/admin(/.*)$ $1 break;
        proxy_pass http://module2_backend;
    }

    # Module 2 Backend API
    # /admin/api/projects → backend receives /api/projects
    location /admin/api/ {
        rewrite ^/admin(/.*)$ $1 break;
        proxy_pass http://module2_backend;
    }

    # Module 2 Frontend
    # /admin/settings → frontend receives /settings
    location /admin/ {
        proxy_pass http://module2_frontend;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =====================================================================
    # MODULE 1 — Main Application (catch-all, lowest priority)
    # =====================================================================

    # Module 1 Backend API  (NO trailing slash — preserves /api/ prefix)
    # /api/published-projects → backend receives /api/published-projects
    location /api/ {
        proxy_pass http://module1_backend;
    }

    # Module 1 Frontend (default catch-all)
    location / {
        proxy_pass http://module1_frontend;

        # WebSocket support
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # =====================================================================
    # Health Check Endpoint
    # =====================================================================
    location /nginx-health {
        access_log off;
        return 200 '{"status":"healthy","timestamp":"$time_iso8601"}';
        add_header Content-Type application/json;
    }

    # =====================================================================
    # Error Pages
    # =====================================================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
        internal;
    }
}
