<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Admin Portal — ADM Analytics</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#f0f2f8;color:#0A0F2C;min-height:100vh;overflow:hidden}
.app{display:flex;height:100vh}

/* ─── SIDEBAR ─── */
.sidebar{width:230px;min-width:230px;background:#0A0F2C;display:flex;flex-direction:column;border-right:1px solid rgba(255,255,255,0.06)}
.sb-logo-wrap{padding:18px 16px 14px;border-bottom:1px solid rgba(255,255,255,0.08);display:flex;align-items:center;gap:10px}
.sb-logo-wrap img{height:34px;object-fit:contain}
.sb-logo-text{display:flex;flex-direction:column}
.sb-brand{font-family:'Sora',sans-serif;font-weight:800;font-size:12px;color:#FF6B2B;letter-spacing:.08em}
.sb-tagline{font-size:9px;color:rgba(255,255,255,0.3);letter-spacing:.04em;text-transform:uppercase;margin-top:1px}
.sb-section{padding:16px 18px 5px;font-size:9px;font-weight:600;letter-spacing:.1em;color:rgba(255,255,255,0.22);text-transform:uppercase}
.nav-btn{display:flex;align-items:center;gap:10px;padding:10px 14px;margin:2px 8px;border-radius:8px;border:none;background:transparent;color:rgba(255,255,255,0.48);font-family:'DM Sans',sans-serif;font-size:13px;font-weight:500;cursor:pointer;width:calc(100% - 16px);text-align:left;transition:all .15s}
.nav-btn:hover{background:rgba(255,255,255,0.07);color:#fff}
.nav-btn.active{background:#FF6B2B;color:#fff}
.nav-icon{font-size:14px;width:20px;text-align:center;flex-shrink:0}
.badge{background:#EF4444;color:#fff;border-radius:10px;padding:1px 7px;font-size:10px;font-weight:700;margin-left:auto}
.sb-footer{margin-top:auto;padding:14px 16px;border-top:1px solid rgba(255,255,255,0.06);display:flex;align-items:center;gap:10px}
.sb-av{width:34px;height:34px;border-radius:50%;background:#FF6B2B;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:700;font-size:12px;color:#fff;flex-shrink:0}
.sb-uname{font-size:12px;font-weight:600;color:#fff}
.sb-urole{font-size:10px;color:rgba(255,255,255,0.3)}

/* ─── TOPBAR ─── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{background:#fff;height:58px;padding:0 26px;display:flex;align-items:center;justify-content:flex-end;gap:14px;flex-shrink:0;border-bottom:1px solid #e8ecf4;box-shadow:0 1px 4px rgba(10,15,44,0.06)}
.tb-page-title{margin-right:auto;font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:#0A0F2C}
.tb-bell{background:transparent;border:none;cursor:pointer;font-size:20px;position:relative;padding:4px;line-height:1}
.tb-bell-dot{position:absolute;top:2px;right:2px;width:7px;height:7px;background:#EF4444;border-radius:50%}
.tb-user{text-align:right}
.tb-welcome{font-size:9px;color:#9CA3AF;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.tb-wname{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:#0A0F2C}
.tb-av{width:36px;height:36px;border-radius:50%;background:#FF6B2B;display:flex;align-items:center;justify-content:center;font-family:'Sora',sans-serif;font-weight:800;font-size:12px;color:#fff;cursor:pointer}

/* ─── CONTENT ─── */
.content{flex:1;overflow-y:auto;padding:22px 26px}

/* ─── PAGE HEADER ─── */
.pg-header{margin-bottom:20px}
.pg-title{font-family:'Sora',sans-serif;font-weight:700;font-size:20px;color:#0A0F2C}
.pg-sub{font-size:12px;color:#9CA3AF;margin-top:3px}

/* ─── STAT CARDS (top row) ─── */
.stat-row{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}
.stat-card{background:#fff;border-radius:14px;padding:20px;border:1px solid #e8ecf4;position:relative;overflow:hidden;box-shadow:0 2px 8px rgba(10,15,44,0.04)}
.stat-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;border-radius:14px 0 0 14px}
.stat-card.c-blue::before{background:#3B82F6}
.stat-card.c-orange::before{background:#F97316}
.stat-card.c-green::before{background:#22C55E}
.stat-card.c-red::before{background:#EF4444}
.stat-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;margin-bottom:14px}
.stat-num{font-family:'Sora',sans-serif;font-weight:800;font-size:34px;line-height:1}
.stat-lbl{font-size:12px;color:#9CA3AF;margin-top:5px;font-weight:500}

/* ─── SECTION LABEL ─── */
.sec-label{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#0A0F2C;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.sec-label span{font-size:11px;font-weight:500;color:#9CA3AF;font-family:'DM Sans',sans-serif}

/* ─── DEPT CARDS + ACCORDION ─── */
.dept-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}
.dept-wrap{border-radius:14px;overflow:hidden;box-shadow:0 2px 8px rgba(10,15,44,0.05)}
.dept-card{background:#fff;padding:16px;border:1px solid #e8ecf4;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:13px;border-bottom:none;border-radius:14px}
.dept-wrap.open .dept-card{border-radius:14px 14px 0 0;border-bottom:1px solid #e8ecf4}
.dept-card:hover{background:#fafbff}
.dept-icon{width:42px;height:42px;border-radius:11px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.dept-info{flex:1;min-width:0}
.dept-name{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:#0A0F2C}
.dept-sub{font-size:10px;color:#9CA3AF;margin-top:1px}
.dept-badge{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;flex-shrink:0}
.dept-chevron{font-size:11px;color:#9CA3AF;transition:transform .25s;flex-shrink:0;margin-left:4px}
.dept-wrap.open .dept-chevron{transform:rotate(180deg)}

/* ─── DEPT DROPDOWN ─── */
.dept-drop{background:#fff;border:1px solid #e8ecf4;border-top:none;border-radius:0 0 14px 14px;overflow:hidden;max-height:0;transition:max-height .3s ease}
.dept-wrap.open .dept-drop{max-height:200px}
.dept-drop-inner{padding:14px 16px 16px}
.dept-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ds-box{background:#f9fafb;border-radius:10px;padding:10px 8px;text-align:center;border:1px solid #f0f2f8}
.ds-num{font-family:'Sora',sans-serif;font-weight:800;font-size:20px}
.ds-lbl{font-size:9px;font-weight:600;color:#9CA3AF;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}

/* ─── RECENT SUBMISSIONS TABLE ─── */
.card{background:#fff;border-radius:14px;border:1px solid #e8ecf4;box-shadow:0 2px 8px rgba(10,15,44,0.04);overflow:hidden}
.card-header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:2px solid #f4f6fb}
.card-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#0A0F2C}
.card-sub{font-size:11px;color:#9CA3AF;margin-top:2px}
.text-link{background:transparent;border:none;color:#FF6B2B;cursor:pointer;font-size:12px;font-weight:600;font-family:'DM Sans',sans-serif}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;padding:10px 16px;font-size:9px;font-weight:700;letter-spacing:.08em;color:#9CA3AF;text-transform:uppercase;background:#fafbff;border-bottom:1px solid #f0f2f8}
td{padding:12px 16px;font-size:12px;border-bottom:1px solid #f9fafb;color:#374151;vertical-align:middle}
tr:last-child td{border-bottom:none}
tr:hover td{background:#fafbff}
.token-lbl{color:#FF6B2B;font-weight:700;font-size:11px;font-family:'Sora',sans-serif}

/* ─── STATUS PILL ─── */
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:4px 10px;border-radius:20px}
.pill.Pending{background:#FFF7ED;color:#EA580C}
.pill.Published{background:#F0FDF4;color:#16A34A}
.pill.Rejected{background:#FFF1F2;color:#DC2626}
.pill-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}
.pill.Pending .pill-dot{background:#F97316}
.pill.Published .pill-dot{background:#22C55E}
.pill.Rejected .pill-dot{background:#EF4444}

/* ─── SUBMISSIONS PAGE ─── */
.subs-toolbar{display:flex;gap:10px;margin-bottom:18px;align-items:center;flex-wrap:wrap}
.search-box{display:flex;align-items:center;gap:8px;background:#fff;border:1.5px solid #e8ecf4;border-radius:10px;padding:0 14px;flex:1;min-width:220px;transition:border-color .15s}
.search-box:focus-within{border-color:#FF6B2B}
.search-box input{border:none;background:transparent;padding:10px 0;color:#0A0F2C;font-size:13px;outline:none;font-family:'DM Sans',sans-serif;width:100%}
.search-icon{color:#9CA3AF;font-size:16px;flex-shrink:0}
.sel-wrap select{background:#fff;border:1.5px solid #e8ecf4;border-radius:10px;padding:10px 13px;color:#0A0F2C;font-size:12px;outline:none;font-family:'DM Sans',sans-serif;transition:border-color .15s;cursor:pointer}
.sel-wrap select:focus{border-color:#FF6B2B}
.count-chip{font-size:11px;color:#6B7280;white-space:nowrap;background:#fff;border:1px solid #e8ecf4;border-radius:20px;padding:6px 14px;font-weight:600}

/* ─── SUBMISSION CARD ─── */
.sub-list{display:flex;flex-direction:column;gap:10px}
.sub-card{background:#fff;border-radius:14px;border:1px solid #e8ecf4;padding:0;overflow:hidden;box-shadow:0 2px 8px rgba(10,15,44,0.04);transition:box-shadow .2s,border-color .2s}
.sub-card:hover{box-shadow:0 6px 20px rgba(10,15,44,0.09);border-color:#d0d7e8}
.sub-card-inner{display:flex;align-items:stretch;gap:0}
.sub-dept-bar{width:5px;flex-shrink:0;border-radius:14px 0 0 14px}
.sub-main{display:flex;align-items:center;gap:16px;padding:16px 20px;flex:1;min-width:0}
.sub-id-col{min-width:130px}
.sub-token{font-size:11px;font-weight:700;color:#FF6B2B;font-family:'Sora',sans-serif;margin-bottom:4px}
.sub-dept-tag{display:inline-block;font-size:10px;padding:2px 8px;border-radius:4px;font-weight:600;margin-bottom:6px}
.sub-team{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#0A0F2C}
.sub-center{flex:1;min-width:0;padding:0 10px}
.sub-proj{font-family:'Sora',sans-serif;font-weight:600;font-size:14px;color:#0A0F2C;margin-bottom:3px}
.sub-desc{font-size:12px;color:#6B7280;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-bottom:4px}
.sub-date{font-size:11px;color:#9CA3AF}
.sub-right-col{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:10px;min-width:120px;flex-shrink:0}
.btn-review{background:#FF6B2B;border:none;border-radius:8px;padding:8px 16px;color:#fff;cursor:pointer;font-size:11px;font-weight:700;font-family:'DM Sans',sans-serif;transition:background .15s;white-space:nowrap}
.btn-review:hover{background:#e85c1c}

/* ─── PUBLISHED PAGE ─── */
.pub-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.pub-card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e8ecf4;box-shadow:0 2px 8px rgba(10,15,44,0.04);transition:transform .2s,box-shadow .2s}
.pub-card:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(10,15,44,0.1)}
.pub-banner{height:80px;display:flex;align-items:center;justify-content:center;font-size:28px;position:relative}
.pub-live-badge{position:absolute;top:10px;right:10px;background:#22C55E;color:#fff;font-size:9px;font-weight:700;padding:3px 9px;border-radius:20px;letter-spacing:.06em}
.pub-body{padding:14px}
.pub-title{font-family:'Sora',sans-serif;font-weight:700;font-size:13px;color:#0A0F2C;margin-bottom:3px}
.pub-meta{font-size:11px;color:#9CA3AF;line-height:1.6;margin-bottom:12px}
.pub-actions{display:flex;gap:8px}
.btn-view-live{flex:2;padding:8px;background:#FF6B2B;border:none;border-radius:8px;color:#fff;font-size:11px;font-weight:700;cursor:pointer;font-family:'DM Sans',sans-serif;transition:background .15s}
.btn-view-live:hover{background:#e85c1c}
.btn-unpublish{flex:1;padding:8px;background:transparent;border:1.5px solid #e8ecf4;border-radius:8px;color:#6B7280;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.btn-unpublish:hover{border-color:#EF4444;color:#EF4444}

/* ─── SETTINGS ─── */
.settings-card{background:#fff;border-radius:14px;max-width:500px;border:1px solid #e8ecf4;box-shadow:0 2px 8px rgba(10,15,44,0.04);overflow:hidden}
.settings-head{background:#0A0F2C;padding:16px 22px;display:flex;align-items:center;gap:12px}
.settings-head-icon{width:38px;height:38px;border-radius:10px;background:#FF6B2B;display:flex;align-items:center;justify-content:center;font-size:18px}
.settings-head-title{font-family:'Sora',sans-serif;font-weight:700;font-size:14px;color:#fff}
.settings-head-sub{font-size:11px;color:rgba(255,255,255,0.35);margin-top:1px}
.setting-row{display:flex;justify-content:space-between;align-items:center;padding:14px 22px;border-bottom:1px solid #f4f6fb}
.setting-row:last-child{border-bottom:none}
.setting-label{font-size:13px;color:#6B7280;font-weight:500}
.setting-val{font-size:13px;font-weight:700;color:#0A0F2C}

/* ──── REVIEW DRAWER ──── */
.overlay{position:fixed;inset:0;background:rgba(10,15,44,0.5);z-index:200;display:flex;justify-content:flex-end;backdrop-filter:blur(3px)}
.drawer{width:620px;background:#f4f6fb;height:100vh;display:flex;flex-direction:column;box-shadow:-8px 0 40px rgba(10,15,44,0.18)}

/* Drawer Header */
.dr-header{background:#0A0F2C;padding:18px 22px;display:flex;align-items:flex-start;justify-content:space-between;flex-shrink:0}
.dr-header-left{flex:1;min-width:0}
.dr-token{font-size:11px;color:#FF6B2B;font-weight:700;font-family:'Sora',sans-serif;margin-bottom:4px}
.dr-title{font-family:'Sora',sans-serif;font-weight:700;font-size:16px;color:#fff;margin-bottom:2px}
.dr-team{font-size:12px;color:rgba(255,255,255,0.4)}
.dr-close{background:rgba(255,255,255,0.1);border:none;color:#fff;width:30px;height:30px;border-radius:50%;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-left:12px;transition:background .15s}
.dr-close:hover{background:rgba(255,255,255,0.2)}

/* Drawer Status Bar */
.dr-statusbar{background:#0D1330;padding:12px 22px;display:flex;align-items:center;gap:8px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,0.06)}
.dr-dept-chip{display:inline-flex;align-items:center;gap:5px;padding:4px 12px;border-radius:20px;font-size:11px;font-weight:600}
.dr-current-status{margin-left:auto;display:flex;align-items:center;gap:6px;font-size:11px;font-weight:600}

/* Drawer Tabs */
.dr-tabs{display:flex;background:#fff;border-bottom:2px solid #e8ecf4;flex-shrink:0}
.dr-tab{flex:1;padding:13px 8px;background:transparent;border:none;border-bottom:2px solid transparent;color:#9CA3AF;cursor:pointer;font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;transition:all .15s;margin-bottom:-2px}
.dr-tab.active{color:#FF6B2B;border-bottom-color:#FF6B2B}

/* Drawer Body */
.dr-body{flex:1;overflow-y:auto;padding:20px}

/* Field boxes */
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:16px}
.f-box{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e8ecf4}
.f-label{font-size:9px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:4px}
.f-val{font-size:13px;font-weight:600;color:#0A0F2C}
.f-section-label{font-size:9px;color:#9CA3AF;text-transform:uppercase;letter-spacing:.08em;font-weight:700;margin-bottom:8px;margin-top:14px}
.desc-box{background:#fff;border-radius:10px;padding:14px;font-size:12px;color:#374151;line-height:1.75;border:1px solid #e8ecf4;margin-bottom:4px}
.ms-item{display:flex;justify-content:space-between;align-items:center;padding:9px 13px;background:#fff;border-radius:8px;margin-bottom:6px;font-size:12px;font-weight:600;color:#0A0F2C;border:1px solid #e8ecf4}
.ms-date{color:#9CA3AF;font-weight:400;font-size:11px}
.tag-wrap{display:flex;flex-wrap:wrap;gap:6px}
.tech-tag{background:#FFF7ED;color:#FF6B2B;border-radius:6px;padding:4px 11px;font-size:11px;font-weight:600;border:1px solid #FFD5C2}

/* Files tab */
.banner-preview{height:100px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:36px;margin-bottom:14px;border:2px dashed #e8ecf4}
.file-item{display:flex;align-items:center;gap:12px;padding:11px 14px;background:#fff;border-radius:10px;margin-bottom:8px;border:1px solid #e8ecf4}
.file-icon{font-size:20px;flex-shrink:0}
.file-name{flex:1;font-size:12px;font-weight:600;color:#0A0F2C}
.file-size{font-size:11px;color:#9CA3AF}
.file-dl{background:transparent;border:1.5px solid #FF6B2B;border-radius:6px;color:#FF6B2B;padding:5px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .15s}
.file-dl:hover{background:#FF6B2B;color:#fff}

/* Validation tab */
.val-hint{font-size:12px;color:#6B7280;margin-bottom:14px;background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e8ecf4;display:flex;align-items:center;gap:8px}
.chk-row{display:flex;align-items:center;gap:12px;padding:13px;background:#fff;border-radius:10px;margin-bottom:8px;cursor:pointer;border:1.5px solid #e8ecf4;transition:all .15s}
.chk-row.checked{border-color:#22C55E;background:#F0FDF4}
.chk-box{width:22px;height:22px;border-radius:6px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:all .15s;border:2px solid #e8ecf4;background:#fff}
.chk-box.checked{background:#22C55E;border-color:#22C55E}
.chk-lbl{font-size:12px;color:#6B7280;font-weight:500;flex:1}
.chk-lbl.checked{color:#0A0F2C;font-weight:600}
.val-progress{background:#fff;border-radius:10px;padding:12px 14px;border:1px solid #e8ecf4;margin-bottom:14px}
.val-prog-label{font-size:11px;color:#6B7280;font-weight:600;margin-bottom:8px;display:flex;justify-content:space-between}
.val-prog-bar{height:6px;background:#f0f2f8;border-radius:3px;overflow:hidden}
.val-prog-fill{height:100%;background:#22C55E;border-radius:3px;transition:width .3s}

/* ──── DRAWER FOOTER (ACTION AREA) ──── */
.dr-footer{flex-shrink:0;background:#fff;border-top:2px solid #e8ecf4}
.dr-footer-top{padding:14px 20px;display:flex;gap:10px;align-items:stretch}
.btn-publish-big{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14px 20px;border:none;border-radius:12px;cursor:pointer;font-family:'Sora',sans-serif;transition:all .2s;gap:2px}
.btn-publish-big .btn-icon{font-size:22px;line-height:1}
.btn-publish-big .btn-main-lbl{font-size:13px;font-weight:800;letter-spacing:.04em}
.btn-publish-big .btn-sub-lbl{font-size:10px;font-weight:500;opacity:.8}
.btn-action-sm{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:12px 16px;border-radius:12px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:all .2s;min-width:90px}
.btn-action-sm .btn-icon{font-size:18px;line-height:1}
.btn-action-sm .btn-action-lbl{font-size:11px;font-weight:700}
.pub-enabled{background:linear-gradient(135deg,#22C55E,#16A34A);color:#fff;border:none}
.pub-enabled:hover{box-shadow:0 6px 20px rgba(34,197,94,0.35);transform:translateY(-1px)}
.pub-disabled{background:#f0f2f8;color:#9CA3AF;border:none;cursor:not-allowed}
.btn-reject-action{background:#FFF1F2;color:#DC2626;border:1.5px solid #FCA5A5}
.btn-reject-action:hover{background:#DC2626;color:#fff;border-color:#DC2626}
.btn-changes-action{background:#FFF7ED;color:#EA580C;border:1.5px solid #FED7AA}
.btn-changes-action:hover{background:#EA580C;color:#fff;border-color:#EA580C}

/* ──── MODAL ──── */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,44,0.6);z-index:400;display:flex;align-items:center;justify-content:center;backdrop-filter:blur(4px)}
.modal{background:#fff;border-radius:16px;padding:28px;width:440px;box-shadow:0 24px 60px rgba(10,15,44,0.2)}
.modal-icon{font-size:40px;margin-bottom:12px;display:block}
.modal-title{font-family:'Sora',sans-serif;font-weight:700;font-size:18px;color:#0A0F2C;margin-bottom:6px}
.modal-sub{font-size:13px;color:#6B7280;margin-bottom:16px;line-height:1.5}
.modal textarea{width:100%;background:#f9fafb;border:1.5px solid #e8ecf4;border-radius:10px;padding:13px;color:#0A0F2C;font-size:13px;outline:none;resize:none;font-family:'DM Sans',sans-serif;transition:border-color .15s}
.modal textarea:focus{border-color:#FF6B2B}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-confirm{flex:1;padding:12px;border-radius:10px;border:none;color:#fff;font-family:'Sora',sans-serif;font-weight:700;font-size:13px;cursor:pointer}
.modal-cancel{flex:1;padding:12px;border-radius:10px;border:1.5px solid #e8ecf4;background:transparent;color:#6B7280;font-family:'DM Sans',sans-serif;font-weight:600;font-size:13px;cursor:pointer;transition:all .15s}
.modal-cancel:hover{border-color:#0A0F2C;color:#0A0F2C}

/* ──── TOASTS ──── */
#toasts{position:fixed;top:16px;right:16px;z-index:600;display:flex;flex-direction:column;gap:8px;pointer-events:none}
.toast{background:#fff;border-radius:12px;padding:13px 18px;font-size:13px;display:flex;align-items:center;gap:10px;min-width:260px;box-shadow:0 6px 24px rgba(10,15,44,0.14);animation:tin .35s cubic-bezier(.34,1.56,.64,1);font-weight:500;color:#0A0F2C;border:1px solid #e8ecf4}
.toast.s{border-left:4px solid #22C55E}
.toast.e{border-left:4px solid #EF4444}
.toast.i{border-left:4px solid #FF6B2B}
.toast-ico{font-size:18px;flex-shrink:0}
@keyframes tin{from{transform:translateX(115%);opacity:0}to{transform:translateX(0);opacity:1}}
</style>

var PAGE_TITLES={dashboard:"Dashboard",submissions:"Submissions",published:"Published Projects",settings:"Settings"};
function goTo(page){
  PAGE=page;

  ["dashboard","submissions","published","settings"].forEach(function(p){

/* ══════════════ DASHBOARD ══════════════ */
function deptStats(deptName){
  var items=DATA.filter(function(s){return s.dept===deptName;});
  return{
    total:items.length,
    published:items.filter(function(s){return s.status==="Published";}).length,
    pending:items.filter(function(s){return s.status==="Pending";}).length,
    rejected:items.filter(function(s){return s.status==="Rejected";}).length
  };
}

function toggleDept(deptName){
  OPEN_DEPT=OPEN_DEPT===deptName?null:deptName;
  renderDeptCards();
}

function renderDeptCards(){
  var depts={};
  DATA.forEach(function(s){depts[s.dept]=(depts[s.dept]||0)+1;});
  var dNames=Object.keys(depts);
  var html=dNames.map(function(d){
    var col=deptColor(d);
    var icon=deptIcon(d);
    var desc=DD[d]||"Total projects this period";
    var stats=deptStats(d);
    var isOpen=OPEN_DEPT===d;

    return '<div class="dept-wrap'+(isOpen?" open":"")+'" id="dw-'+d.replace(/ /g,"_")+'">'

    +'</div>';
  }).join("");
  c.innerHTML='<div class="pg-header"><div class="pg-title">Published Projects</div><div class="pg-sub">'+pub.length+' projects currently live and accessible</div></div><div class="pub-grid">'+cards+'</div>';
}
function unpublish(id){
  DATA.forEach(function(s,i){if(s.id===id)DATA[i].status="Pending";});
  updateBadge();showToast("Project unpublished and moved to Pending.","i");
  pubPage(document.getElementById("content"));
}

/* ══════════════ SETTINGS PAGE ══════════════ */
function settingsPage(c){
  var rows=[["Admin Name","Admin User"],["Email","admin@internal.corp"],["Role","Administrator"],["Portal Version","v2.4.1"]].map(function(r){
    return '<div class="setting-row"><span class="setting-label">'+r[0]+'</span><span class="setting-val">'+r[1]+'</span></div>';
  }).join("");
  c.innerHTML='<div class="pg-header"><div class="pg-title">Settings</div><div class="pg-sub">Manage your admin account and portal preferences</div></div>'
    +'<div class="settings-card">'
      +'<div class="settings-head"><div class="settings-head-icon">⚙️</div><div><div class="settings-head-title">Admin Account</div><div class="settings-head-sub">Your portal credentials and info</div></div></div>'
      +rows
    +'</div>';
}

/* ══════════════ REVIEW DRAWER ══════════════ */
function openDrawer(id){
  DR_SUB=DATA.find(function(s){return s.id===id;});
  DR_TAB=0;
  DR_CHK=[false,false,false,false,false];
  renderDrawer();
}
function closeDrawer(){DR_SUB=null;document.getElementById("drawer-root").innerHTML="";}
function switchTab(t){DR_TAB=t;renderDrawer();}
function toggleChk(i){DR_CHK[i]=!DR_CHK[i];renderDrawer();}

function renderDrawer(){
  if(!DR_SUB){document.getElementById("drawer-root").innerHTML="";return;}
  var s=DR_SUB;
  var col=deptColor(s.dept);
  var icon=deptIcon(s.dept);
  var allChecked=DR_CHK.every(Boolean);
  var canPub=allChecked&&s.status==="Pending";
  var checkedCount=DR_CHK.filter(Boolean).length;
  var pct=Math.round((checkedCount/5)*100);

  /* Tab body */
  var tabBody="";
  if(DR_TAB===0){
    var flds=[["Team",s.team],["Team Lead",s.lead],["Department",s.dept],["Email",s.email],["Project Code",s.code],["Category",s.cat],["Start Date",s.start],["End Date",s.end]];
    tabBody='<div class="field-grid">'+flds.map(function(f){return '<div class="f-box"><div class="f-label">'+f[0]+'</div><div class="f-val">'+f[1]+'</div></div>';}).join("")+'</div>'
      +'<div class="f-section-label">Description</div>'
      +'<div class="desc-box">'+s.desc+'</div>'
      +'<div class="f-section-label">Milestones</div>'
      +s.ms.map(function(m){return '<div class="ms-item"><span>📌 '+m.n+'</span><span class="ms-date">'+m.d+'</span></div>';}).join("")
      +'<div class="f-section-label">Tech Stack</div>'
      +'<div class="tag-wrap">'+s.tech.map(function(t){return '<span class="tech-tag">'+t+'</span>';}).join("")+'</div>';
  } else if(DR_TAB===1){
    tabBody='<div class="f-section-label">Project Banner</div>'
      +'<div class="banner-preview" style="background:'+col+'12;color:'+col+'"><span style="font-size:48px">'+icon+'</span></div>'
      +'<div class="f-section-label">Uploaded Documents</div>'
      +[{n:"Project_Brief.pdf",s:"245 KB",i:"📄"},{n:"Technical_Spec.docx",s:"128 KB",i:"📝"},{n:"Architecture_Diagram.pdf",s:"1.2 MB",i:"📊"}].map(function(f){
        return '<div class="file-item"><span class="file-icon">'+f.i+'</span><span class="file-name">'+f.n+'</span><span class="file-size">'+f.s+'</span><button class="file-dl" onclick="showToast(\'Downloading '+f.n+'...\',\'i\')">↓ Download</button></div>';
      }).join("");
  } else {
    var chkLabels=["Team identity verified","Project details complete and accurate","All required files uploaded and valid","No duplicate submission from this team","Content approved for internal publication"];
    tabBody='<div class="val-progress"><div class="val-prog-label"><span>Validation Progress</span><span style="color:#22C55E;font-weight:700">'+checkedCount+'/5 checks</span></div><div class="val-prog-bar"><div class="val-prog-fill" style="width:'+pct+'%"></div></div></div>'
      +'<div class="val-hint">💡 Complete all 5 checks below to unlock the Publish button.</div>'
      +chkLabels.map(function(lbl,i){
        var on=DR_CHK[i];
        return '<div class="chk-row'+(on?" checked":"")+'" onclick="toggleChk('+i+')">'
          +'<div class="chk-box'+(on?" checked":"")+'">'+(on?'<span style="color:#fff;font-size:13px;font-weight:800">✓</span>':"")+'</div>'
          +'<span class="chk-lbl'+(on?" checked":"")+'">'+lbl+'</span>'
          +'</div>';
      }).join("");
  }

  var tabs=["Project Info","Files & Assets","Validation"].map(function(t,i){
    return '<button class="dr-tab'+(DR_TAB===i?" active":"")+'" onclick="switchTab('+i+')">'+t+'</button>';
  }).join("");

  var footerNote=s.status==="Published"?'<div style="font-size:11px;color:#6B7280;text-align:center;padding:8px 20px;border-top:1px solid #f0f2f8">This project is already <span style="color:#22C55E;font-weight:700">Published</span></div>'
    :s.status==="Rejected"?'<div style="font-size:11px;color:#6B7280;text-align:center;padding:8px 20px;border-top:1px solid #f0f2f8">This project was <span style="color:#EF4444;font-weight:700">Rejected</span></div>'
    :'';

  document.getElementById("drawer-root").innerHTML=
    '<div class="overlay" onclick="if(event.target===this)closeDrawer()">'
      +'<div class="drawer">'

        /* header */
        +'<div class="dr-header">'
          +'<div class="dr-header-left">'
            +'<div class="dr-token">'+s.id+'</div>'
            +'<div class="dr-title">'+s.proj+'</div>'
            +'<div class="dr-team">'+s.team+' &nbsp;·&nbsp; Submitted '+s.date+'</div>'
          +'</div>'
          +'<button class="dr-close" onclick="closeDrawer()">✕</button>'
        +'</div>'

        /* dept + status bar */
        +'<div class="dr-statusbar">'
          +'<span class="dr-dept-chip" style="background:'+col+'20;color:'+col+'">'+icon+' '+s.dept+'</span>'
          +'<span style="font-size:11px;color:rgba(255,255,255,0.3);font-weight:500">'+s.cat+'</span>'
          +'<div class="dr-current-status">Current Status: '+pillHtml(s.status)+'</div>'
        +'</div>'

        /* tabs */
        +'<div class="dr-tabs">'+tabs+'</div>'

        /* body */
        +'<div class="dr-body">'+tabBody+'</div>'

        /* footer action bar */
        +'<div class="dr-footer">'
          +'<div class="dr-footer-top">'
            +'<button class="btn-publish-big '+(canPub?"pub-enabled":"pub-disabled")+'" '+(canPub?"":"disabled")
              +' onclick="'+(canPub?"publishSub(\'"+s.id+"\')":'showToast("Complete all 5 validation checks first to unlock publish","i")')+'">'
              +'<span class="btn-icon">🚀</span>'
              +'<span class="btn-main-lbl">PUBLISH</span>'
              +'<span class="btn-sub-lbl">'+(canPub?"Ready to go live":"Complete validation first")+'</span>'
            +'</button>'
            +'<button class="btn-action-sm btn-reject-action" onclick="showRejectModal(\''+s.id+'\')">'
              +'<span class="btn-icon">❌</span>'
              +'<span class="btn-action-lbl">REJECT</span>'
            +'</button>'
            +'<button class="btn-action-sm btn-changes-action" onclick="showChangesModal(\''+s.id+'\')">'
              +'<span class="btn-icon">📝</span>'
              +'<span class="btn-action-lbl">CHANGES</span>'
            +'</button>'
          +'</div>'
          +footerNote
        +'</div>'

      +'</div>'
    +'</div>';
}

function publishSub(id){
  DATA.forEach(function(s,i){if(s.id===id)DATA[i].status="Published";});
  updateBadge();showToast("🎉 Project published successfully and is now live!","s");
  closeDrawer();render();
}

function showRejectModal(id){
  document.getElementById("modal-root").innerHTML=
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">'
      +'<div class="modal">'
        +'<span class="modal-icon">❌</span>'
        +'<div class="modal-title">Reject Submission</div>'
        +'<div class="modal-sub">Please provide a clear reason for rejection. This will be shared with the team for revision.</div>'
        +'<textarea id="modal-txt" rows="4" placeholder="Enter rejection reason..."></textarea>'
        +'<div class="modal-actions">'
          +'<button class="modal-confirm" style="background:#EF4444" onclick="confirmReject(\''+id+'\')">Confirm Reject</button>'
          +'<button class="modal-cancel" onclick="closeModal()">Cancel</button>'
        +'</div>'
      +'</div>'
    +'</div>';
}

function confirmReject(id){
  DATA.forEach(function(s,i){if(s.id===id)DATA[i].status="Rejected";});
  updateBadge();showToast("Submission rejected successfully.","e");
  closeModal();closeDrawer();render();
}

function showChangesModal(id){
  document.getElementById("modal-root").innerHTML=
    '<div class="modal-bg" onclick="if(event.target===this)closeModal()">'
      +'<div class="modal">'
        +'<span class="modal-icon">📝</span>'
        +'<div class="modal-title">Request Changes</div>'
        +'<div class="modal-sub">Describe the changes required. The team will receive your feedback and can resubmit.</div>'
        +'<textarea id="modal-txt" rows="4" placeholder="Describe what needs to be updated or revised..."></textarea>'
        +'<div class="modal-actions">'
          +'<button class="modal-confirm" style="background:#FF6B2B" onclick="confirmChanges(\''+id+'\')">Send Request</button>'
          +'<button class="modal-cancel" onclick="closeModal()">Cancel</button>'
        +'</div>'
      +'</div>'
    +'</div>';
}

function confirmChanges(id){
  showToast("Change request sent to the team successfully.","i");
  closeModal();
}

function closeModal(){document.getElementById("modal-root").innerHTML="";}

/* ══════════════ INIT ══════════════ */
updateBadge();
dashPage(document.getElementById("content"));
</script>
</body>
</html>
